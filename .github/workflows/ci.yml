name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS ARM64, runner: macos-15, target: '--mac dmg zip --arm64', os: mac }
          - { name: macOS x64, runner: macos-15-intel, target: '--mac dmg zip --x64', os: mac }
          - { name: Windows x64, runner: windows-2025, target: '--win nsis portable --x64', os: windows }
          - { name: Linux x64, runner: ubuntu-24.04, target: '--linux AppImage deb --x64', os: linux }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, target: '--linux AppImage deb --arm64', os: linux }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:backend:bundle
      - name: Install Linux GUI test dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1 libsecret-1-0
      - name: Electron end-to-end tests (Linux)
        if: matrix.os == 'linux'
        run: xvfb-run -a npm run test:e2e
      - name: Electron end-to-end tests (macOS and Windows)
        if: matrix.os != 'linux'
        run: npm run test:e2e
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: skilldeck-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
